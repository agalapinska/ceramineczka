# Statyczna wersja sklepu na GitHub Pages.
# Wymaga: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
# Opcjonalnie: sekret NOTION_TOKEN (Settings → Secrets → Actions), żeby produkty
# szły z Notion zamiast z danych zastępczych w lib/products.ts.
name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Codzienna przebudowa — zmiany produktów w Notion trafiają na stronę bez commita.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Konfiguracja Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Zdjęcia produktów z Notion
        run: node scripts/notion-images.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      # Statyczny eksport nie obsługuje tras API (Stripe, formularze, proxy zdjęć);
      # w tej wersji płatność i formularze działają przez e-mail (lib/runtime.ts).
      - name: Usuń trasy API
        run: rm -rf app/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
